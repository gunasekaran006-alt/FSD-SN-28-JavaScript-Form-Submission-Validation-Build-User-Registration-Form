<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Description" content="User Registration Form">
    <title>Build: User Registration Form - JS Validation</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
</head>

<body>


    <div class="form-box">
        <h3>Register</h3>
        <form id="myForm">
            <input type="text" id="name" placeholder="Name">
            <div id="nameErr" class="error">Name is required</div>

            <input type="email" id="email" placeholder="Email">
            <div id="emailErr" class="error">Invalid Email</div>

            <input type="password" id="pass" placeholder="Password (min 6)">
            <div id="passErr" class="error">Min 6 characters required</div>

            <button type="submit">Submit</button>
        </form>
    </div>






    <script src="script.js"></script>
</body>

</html>
